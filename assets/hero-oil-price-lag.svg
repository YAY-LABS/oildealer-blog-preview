<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">국제유가 뉴스에서 내 발주 단가까지 이어지는 흐름</title>
  <desc id="desc">국제유가 뉴스가 환율, 정제마진, 국내 공급가, 재고 평균단가를 거쳐 내 발주 단가가 되는 과정을 보여주는 오일딜러 블로그용 흐름도</desc>
  <rect width="1600" height="900" fill="#FFFDFA"/>
  <circle cx="1320" cy="170" r="180" fill="#F5F0FF"/>
  <circle cx="185" cy="735" r="140" fill="#F8F4FF"/>
  <path d="M190 451 C390 330 495 565 695 443 C895 322 1020 542 1220 431 C1322 374 1396 392 1442 420" stroke="#EEE7FF" stroke-width="18" stroke-linecap="round"/>
  <path d="M236 450H445" stroke="#721FE5" stroke-width="5" stroke-linecap="round"/>
  <path d="M429 429L455 450L429 471" stroke="#721FE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M530 450H739" stroke="#721FE5" stroke-width="5" stroke-linecap="round" opacity=".78"/>
  <path d="M723 429L749 450L723 471" stroke="#721FE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <path d="M824 450H1033" stroke="#721FE5" stroke-width="5" stroke-linecap="round" opacity=".62"/>
  <path d="M1017 429L1043 450L1017 471" stroke="#721FE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".62"/>
  <path d="M1118 450H1327" stroke="#721FE5" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <path d="M1311 429L1337 450L1311 471" stroke="#721FE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>

  <g filter="url(#shadow)">
    <rect x="120" y="350" width="220" height="150" rx="28" fill="white" stroke="#E4D7FF" stroke-width="2"/>
    <text x="230" y="414" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="32" fill="#15151A">국제유가</text>
    <text x="230" y="455" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="24" fill="#737782">뉴스</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="414" y="350" width="220" height="150" rx="28" fill="#F5F0FF" stroke="#E4D7FF" stroke-width="2"/>
    <text x="524" y="414" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="32" fill="#15151A">환율</text>
    <text x="524" y="455" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="22" fill="#737782">원화 기준</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="708" y="350" width="220" height="150" rx="28" fill="white" stroke="#E4D7FF" stroke-width="2"/>
    <text x="818" y="414" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="32" fill="#15151A">정제마진</text>
    <text x="818" y="455" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="22" fill="#737782">제품별 차이</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1002" y="350" width="220" height="150" rx="28" fill="#F5F0FF" stroke="#E4D7FF" stroke-width="2"/>
    <text x="1112" y="414" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="32" fill="#15151A">국내 공급가</text>
    <text x="1112" y="455" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="22" fill="#737782">적용 시차</text>
  </g>

  <g filter="url(#shadowStrong)">
    <rect x="1296" y="332" width="240" height="186" rx="34" fill="#721FE5"/>
    <text x="1416" y="410" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="850" font-size="34" fill="white">내 발주 단가</text>
    <text x="1416" y="455" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="650" font-size="22" fill="#EEE7FF">견적서 기준</text>
  </g>

  <g>
    <path d="M1052 646 C1160 646 1270 586 1358 515" stroke="#721FE5" stroke-width="4" stroke-dasharray="10 13" stroke-linecap="round" opacity=".72"/>
    <rect x="760" y="586" width="330" height="116" rx="26" fill="white" stroke="#E4D7FF" stroke-width="2"/>
    <text x="925" y="635" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="30" fill="#15151A">재고 평균단가</text>
    <text x="925" y="674" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="22" fill="#737782">현재 손익을 먼저 만짐</text>
  </g>

  <g>
    <rect x="610" y="170" width="380" height="64" rx="32" fill="#F5F0FF" stroke="#E4D7FF"/>
    <circle cx="650" cy="202" r="8" fill="#721FE5"/>
    <text x="680" y="211" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="800" font-size="24" fill="#5414C8">바로 반영되지 않음</text>
  </g>

  <text x="120" y="160" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="900" font-size="44" fill="#15151A">뉴스 속 유가와 실제 발주 단가 사이</text>
  <text x="120" y="210" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-weight="600" font-size="26" fill="#737782">가격보다 먼저 봐야 할 것은 반영되는 순서입니다</text>

  <defs>
    <filter id="shadow" x="80" y="320" width="280" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#721FE5" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowStrong" x="1250" y="300" width="330" height="270" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#721FE5" flood-opacity="0.22"/>
    </filter>
  </defs>
</svg>
